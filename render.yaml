services:
  - type: web
    runtime: static
    name: tart-bakalim-game
    buildCommand: echo Static site ready
    staticPublishPath: ./public
  - type: web
    runtime: python
    name: tart-bakalim-api
    plan: free
    region: frankfurt
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn server:app --bind 0.0.0.0:$PORT
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: tart-bakalim-db
          property: connectionString
databases:
  - name: tart-bakalim-db
    plan: free
    region: frankfurt
